services:
  api:
    image: stelele/cms-backend:latest
    init: true
    ports:
      - "8002:8000"
    volumes:
      - cms_data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8000
      - ConnectionStrings__Sqlite=Data Source=/app/data/cms.db
      - Auth0__Domain={{AUTH0_DOMAIN}}
      - Auth0__Audience={{AUTH0_AUDIENCE}}
      - GROQ__ApiKey={{GROQ_APIKEY}}
      - MediatR__LicenseKey={{MEDIATR_LICENSEKEY}}
      - R2__AccountId={{R2_ACCOUNT_ID}}
      - R2__AccessKeyId={{R2_ACCESS_KEY_ID}}
      - R2__SecretAccessKey={{R2_SECRET_ACCESS_KEY}}
      - R2__PublicBucketName={{R2_PUBLIC_BUCKET_NAME}}
      - R2__PublicBucketUrl={{R2_PUBLIC_BUCKET_URL}}
      - R2__BackupBucketName={{R2_BACKUP_BUCKET_NAME}}
      - R2__SyncIntervalMinutes={{R2_SYNC_INTERVAL}}
      # CORS allowlist. These are public origins, not secrets, so they live here
      # rather than in GitHub secrets - which means the deploy carries them and
      # the app cannot be deployed without them. CorsOriginPolicy refuses to boot
      # in Production when this is empty or contains a wildcard, so omitting these
      # takes the API down rather than silently serving every origin.
      - Cors__AllowedOrigins__0=https://giftmugweni.com
      - Cors__AllowedOrigins__1=https://stelele.github.io
    restart: unless-stopped

volumes:
  cms_data:
    name: cms_data
    external: true
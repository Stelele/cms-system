name: Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Superseded pull request runs are cancelled, so pushing several commits
# to a PR queues one run rather than one per commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  backend-changes:
    runs-on: ubuntu-latest
    needs: frontend-changes
    outputs:
      changed: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  frontend:
    runs-on: ubuntu-latest
    needs: frontend-changes
    if: needs.frontend-changes.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          VITE_API_URL: ${{ secrets.API_URL }}
          VITE_APP_BASE: /cms-system-frontend-build
        run: npm run build

      - name: Copy index.html to 404.html
        working-directory: frontend
        run: cp dist/index.html dist/404.html

      - name: Deploy to GitHub Pages
        # Deploys only from main. A pull request verifies the same build steps
        # above but must never publish the admin UI.
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAT }}
          publish_dir: ./frontend/dist
          publish_branch: gh-pages
          external_repository: Stelele/cms-system-frontend-build

  backend:
    runs-on: ubuntu-latest
    needs: backend-changes
    if: needs.backend-changes.outputs.changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --configuration Release

      - name: Run tests
        working-directory: backend
        run: dotnet test --configuration Release --no-build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        # Deploy-only: a pull request must not authenticate to the registry.
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        # The image is always built, so a pull request catches a broken
        # Dockerfile. Only main pushes it to the registry.
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: stelele/cms-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Replace docker-compose placeholders
        if: github.event_name == 'push'
        run: |
          sed -i \
            -e 's|{{AUTH0_DOMAIN}}|${{ secrets.AUTH0_DOMAIN }}|g' \
            -e 's|{{AUTH0_AUDIENCE}}|${{ secrets.AUTH0_AUDIENCE }}|g' \
            -e 's|{{GROQ_APIKEY}}|${{ secrets.GROQ_API_KEY }}|g' \
            -e 's|{{MEDIATR_LICENSEKEY}}|${{ secrets.MEDIATR_LICENSE_KEY }}|g' \
            -e 's|{{R2_ACCOUNT_ID}}|${{ secrets.R2_ACCOUNT_ID }}|g' \
            -e 's|{{R2_ACCESS_KEY_ID}}|${{ secrets.R2_ACCESS_KEY_ID }}|g' \
            -e 's|{{R2_SECRET_ACCESS_KEY}}|${{ secrets.R2_SECRET_ACCESS_KEY }}|g' \
            -e 's|{{R2_PUBLIC_BUCKET_NAME}}|${{ secrets.R2_PUBLIC_BUCKET_NAME }}|g' \
            -e 's|{{R2_PUBLIC_BUCKET_URL}}|${{ secrets.R2_PUBLIC_BUCKET_URL }}|g' \
            -e 's|{{R2_BACKUP_BUCKET_NAME}}|${{ secrets.R2_BACKUP_BUCKET_NAME }}|g' \
            -e 's|{{R2_SYNC_INTERVAL}}|${{ secrets.R2_SYNC_INTERVAL }}|g' \
            backend/docker-compose.yml

      - name: Copy docker-compose.yml to droplet
        if: github.event_name == 'push'
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: backend/docker-compose.yml
          target: /opt/cms
          strip_components: 1

      - name: Deploy to droplet
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/cms

            # Stop existing container if running
            sudo docker compose -f docker-compose.yml down

            # Pull latest image
            sudo docker compose -f docker-compose.yml pull

            # Start container
            sudo docker compose -f docker-compose.yml up -d

            # Wait for container to start
            sleep 10

            # Verify the API container is actually running. compose names it
            # cms-api-1 from the service name, not after the image, and `set -e`
            # is what makes a failed check fail the step rather than pass
            # silently - previously a grep that matched nothing still exited 0,
            # so a container that never started reported a successful deploy.
            sudo docker ps --format '{{.Names}}' | grep -qx cms-api-1

            # And that it is serving, not merely present. A container can be
            # running and still crash-looping on a startup guard such as the
            # CORS allowlist check.
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null http://localhost:8002/public/blogs; then
                echo "Deployment complete: cms-api-1 is serving /public/blogs"
                exit 0
              fi
              echo "waiting for the API to answer ($i/30)"
              sleep 2
            done

            echo "Deployment failed: cms-api-1 never served /public/blogs" >&2
            sudo docker logs --tail 50 cms-api-1 >&2
            exit 1